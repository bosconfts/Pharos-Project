<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pharos">
  <title>Pharos</title>
  <!-- A marca em tamanho grande: a mesma torre do favicon, com os dois feixes
       que só cabem acima de ~48px. Abaixo disso use favicon.svg. -->
  <style>
    .disc  { fill: #14554f }
    .tower { fill: #edefe9 }
    .beam  { fill: #edefe9; opacity: 0.45 }
    @media (prefers-color-scheme: dark) {
      .disc  { fill: #edefe9 }
      .tower { fill: #14161a }
      .beam  { fill: #14161a; opacity: 0.45 }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="32" />
  <path class="beam" d="M20 17 L6 12 L6 22 Z" />
  <path class="beam" d="M44 17 L58 12 L58 22 Z" />
  <rect class="tower" x="25" y="13" width="14" height="9" />
  <path class="tower" d="M27 22 H37 L40 46 H24 Z" />
  <rect class="tower" x="21" y="46" width="22" height="6" />
</svg>
