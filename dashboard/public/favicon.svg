<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pharos">
  <title>Pharos</title>
  <style>
    /* O disco é o selo, a torre recortada é o farol do nome. Sem feixes: em
       16px eles viram sujeira, e é em 16px que um favicon vive. */
    .disc  { fill: #14554f }
    .tower { fill: #edefe9 }
    @media (prefers-color-scheme: dark) {
      .disc  { fill: #edefe9 }
      .tower { fill: #14161a }
    }
  </style>
  <circle class="disc" cx="32" cy="32" r="32" />
  <rect class="tower" x="25" y="13" width="14" height="9" />
  <path class="tower" d="M27 22 H37 L40 46 H24 Z" />
  <rect class="tower" x="21" y="46" width="22" height="6" />
</svg>
